<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Евгений Назаров</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root { --bg: #f6f4f0; --ink: #141416; --muted: #5d5d66; --accent-text: #a54527; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--bg); color: var(--ink);
    font: 400 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 520px; }
  p.code { font: 500 13px/1.4 ui-monospace, Menlo, monospace; letter-spacing: .04em; color: var(--accent-text); margin: 0 0 16px; }
  h1 { font-size: clamp(32px, 6vw, 48px); line-height: 1.05; letter-spacing: -0.03em; margin: 0 0 16px; }
  p { color: var(--muted); margin: 0 0 28px; }
  a { display: inline-block; padding: 14px 22px; border-radius: 999px; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 600; }
  a:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Такой страницы нет</h1>
  <p>Page not found. Возможно, ссылка устарела.</p>
  <a href="/">На главную · Home</a>
</main>
</body>
</html>
